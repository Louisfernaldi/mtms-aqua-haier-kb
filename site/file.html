<body>
<header>
  <div class="nav">
    <div class="brand"><img src="assets/Haier_Logo.svg" alt="Haier" class="brand-logo"><span class="brand-name">MTMS</span></div>
    <nav class="nav-links">

      <button class="icon-btn" onclick="openSearch()">Cari</button>
      <button class="icon-btn" onclick="toggleTheme()">Mode</button>
    </div>

</header>

<main>
  <section class="hero-mini">
    <span class="hero-mini-ico">🗂️</span>
    <div>
      <h1>File Materi Asli</h1>
      <p>Semua file tersedia langsung di halaman ini; PDF bisa dibuka di browser, DOCX/XLSX diunduh.</p>
    </div>
  </section>
  <div id="file-root"><p class="sec-sub" id="file-loading">Memuat daftar file…</p></div>
</main>

<footer>
  <div class="footer-in">
    <span>MTMS AQUA HAIER — Knowledge Hub · Management Trainee 2026</span>
    <span>Halaman: File</span>
  </div>
</footer>

<div class="search-overlay" id="search-overlay">
  <div class="search-box">
    <input id="search-input" placeholder="Cari di semua materi..." oninput="doSearch()">
    <div class="search-results" id="search-results"></div>
  </div>
</div>

<script src="js/theme.js"></script>
<script src="js/data.js"></script>
<script src="js/search.js"></script>
<script src="js/pdf-preview.js"></script>
<script>
function loadFiles() {
  if (window.MTMS_DATA && window.MTMS_DATA.files && window.MTMS_DATA.files.length) {
    return Promise.resolve(window.MTMS_DATA.files);
  }
  return fetch("data/files.json")
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
}
loadFiles()
  .then(function (groups) {
    var root = document.getElementById("file-root");
    root.innerHTML = "";
    var idx = 0;
    function buildGroup(g) {
      var h = document.createElement("h2");
      h.className = "sec";
      h.textContent = g.folder;
      var ul = document.createElement("ul");
      ul.className = "file-list";
      g.files.forEach(function (f) {
        var li = document.createElement("li");
        var nm = document.createElement("span");
        nm.className = "nm";
        var a = document.createElement("a");
        a.href = f.path;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = f.name;
        nm.appendChild(a);
        if (f.drive) {
          nm.appendChild(document.createTextNode(" "));
          var da = document.createElement("a");
          da.href = f.drive;
          da.target = "_blank";
          da.rel = "noopener";
          da.textContent = "[Drive]";
          nm.appendChild(da);
        }
        var sz = document.createElement("span");
        sz.className = "sz";
        sz.textContent = f.size;
        li.appendChild(nm);
        li.appendChild(sz);
        if (new RegExp("\\.pdf$", "i").test(f.path) || new RegExp("\\.pdf$", "i").test(f.name || "")) {
          var pv = document.createElement("button");
          pv.type = "button";
          pv.className = "btn-preview";
          pv.textContent = "Preview";
          pv.onclick = (function (path) {
            return function () { window.bukaPdfPreview(path); };
          })(f.path);
          li.appendChild(pv);
        }
        ul.appendChild(li);
      });
      root.appendChild(h);
      root.appendChild(ul);
    }
    function renderNext() {
      if (idx >= groups.length) return;
      buildGroup(groups[idx]);
      idx++;
      setTimeout(renderNext, 60);
    }
    renderNext();
  })
  .catch(function (err) {
    var root = document.getElementById("file-root");
    root.innerHTML = '<p class="sec-sub">Gagal memuat daftar file (' + err.message + ').</p>' +
      '<button class="icon-btn" onclick="location.reload()">Coba lagi</button>';
  });
</script>
<button class="to-top" id="to-top" aria-label="Kembali ke atas" title="Kembali ke atas">&#8593;</button>
<script>
var tt = document.getElementById("to-top");
window.addEventListener("scroll", function () {
  tt.classList.toggle("show", window.scrollY > 600);
});
tt.addEventListener("click", function () { window.scrollTo({ top: 0, behavior: "smooth" }); });
</script>
</body>
</html>
