<script>
(function(){
var CAT_ORDER=["SB","TM","BM","SBS","MD"];
var CAT_LABELS={"SB":"1 Pintu","TM":"2 Pintu Top Mount","BM":"2 Pintu Freezer Bawah","SBS":"Side by Side","MD":"Multi Pintu"};
var BRANDS=["LG","MIDEA","POLYTRON","SAMSUNG","SHARP"];
var container=document.getElementById("comp-categories");
var emptyState=document.getElementById("comp-empty");
var compData=null;
var catalogData=[];
var liveReady=false;
var compSha="";
var saveLock=window.MTMSCompetitorSaveLock.create();
var saveBusy=false;
var saveSequence=0;
window.MTMS_COMPETITOR_LIVE_READY=false;

function syncSaveLockState(){var state=saveLock.state();saveBusy=state.busy;saveSequence=state.sequence;}
function beginSaveSequence(){var sequence=saveLock.begin();syncSaveLockState();return sequence;}
function isCurrentSave(sequence){return saveLock.isCurrent(sequence);}
function finishSaveSequence(sequence){var finished=saveLock.finish(sequence);syncSaveLockState();return finished;}
function invalidateSaveSequence(){saveLock.invalidate();syncSaveLockState();}

function grpToCat(g){return{"Single Door":"SB","Top Mount":"TM","Bottom Mount":"BM","Side by Side":"SBS","Multidoor":"MD"}[g]||""}
function fp(v){return v?"Rp "+String(v).replace(/\B(?=(\d{3})+(?!\d))/g,"."):"Belum tersedia"}

function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML.replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

function displayableImage(value){
  var url=String(value==null?"":value).trim();
  if(!url||/[\u0000-\u001f\u007f\\]/.test(url)||/^\/\//.test(url))return"";
  try{
    var parsed=new URL(url,window.location.href);
    if(parsed.protocol==="http:"||parsed.protocol==="https:"||(!/^[a-z][a-z0-9+.-]*:/i.test(url)&&parsed.origin===window.location.origin))return url;
  }catch(_error){return"";}
  return"";
}

function localPreviewImage(value){
  var url=String(value==null?"":value).trim();
  return /^data:image\/(?:png|jpe?g|gif|webp);base64,[a-z0-9+/=\s]+$/i.test(url)?url:"";
}

function showCardImageFallback(image){
  if(!image||image.getAttribute("data-image-fallback")==="true")return;
  image.setAttribute("data-image-fallback","true");
  var fallback=document.createElement("span");
  fallback.className="comp-thumb comp-thumb-missing";
  fallback.setAttribute("aria-label","Foto gagal dimuat");
  fallback.textContent="Foto gagal dimuat";
  if(image.parentNode)image.parentNode.replaceChild(fallback,image);
}

function wireCardImageFallback(image){
  image.addEventListener("error",function(){showCardImageFallback(image);},{once:true});
}

/* === BUILD ROWS: one row per AQUA group, competitors from PDF mapping === */
function buildRows(catCode){
  if(!compData||!compData.brands)return[];
  // index models by brand+model
  var idx={};
  for(var b=0;b<compData.brands.length;b++){
    var brand=compData.brands[b].brand;
    var models=compData.brands[b].models;
    for(var j=0;j<models.length;j++){
      var m=models[j];
      var item={};
      for(var key in m)if(Object.prototype.hasOwnProperty.call(m,key))item[key]=m[key];
      item.brand=brand;
      item.cat=m.cat||m.subcat||"";
      item.capacity=m.capacity_l||0;
      item.price=m.price_idr||0;
      idx[brand+"|"+m.model]=item;
    }
  }
  var groups=compData.groups||[];
  var rows=[];
  for(var i=0;i<groups.length;i++){
    var g=groups[i];
    var aq=idx["AQUA|"+g.aqua];
    if(!aq)continue;
    if(aq.cat!==catCode)continue;
    var competitors={};
    for(var bi=0;bi<BRANDS.length;bi++){
      var brand=BRANDS[bi];
      var compModel=g.competitors&&g.competitors[brand];
      if(compModel){
        var c=idx[brand+"|"+compModel];
        if(c)competitors[brand]=c;
      }
    }
    rows.push({aqua:aq,competitors:competitors});
  }
  return rows;
}

function detailTriggerHtml(record){
  var brand=record.brand||"";
  var model=record.model||"";
  var lk=brand.toLowerCase();
  var image=record.image||record.photo||"";
  var loadable=displayableImage(image);
  var photo=loadable?
    '<img class="comp-thumb" data-src="'+esc(loadable)+'" alt="'+esc(brand+" "+model)+'" loading="lazy">':
    '<span class="comp-thumb comp-thumb-missing" aria-label="Foto belum tersedia">'+(image?"Foto tersedia di sumber":"Belum tersedia")+'</span>';
  return '<button type="button" class="comp-model-info comp-detail-trigger" data-brand="'+esc(brand)+'" data-model="'+esc(model)+'" aria-label="Lihat detail '+esc(brand+" "+model)+'">'+
    photo+'<span class="comp-model-detail">'+
    '<span class="comp-brand-badge comp-'+esc(lk)+'">'+esc(brand)+'</span>'+
    '<strong class="comp-model-name">'+esc(model)+'</strong>'+
    '<span class="comp-meta"><span class="comp-cap">'+(record.capacity?esc(record.capacity+" L"):"Belum tersedia")+'</span>'+
    '<span class="comp-price">'+esc(fp(record.price))+'</span></span>'+
    '<span class="comp-detail-label">Lihat detail</span></span></button>';
}

function findCanonical(model){
  for(var i=0;i<catalogData.length;i++)if(catalogData[i].model===model)return catalogData[i];
  return null;
}

function findCompetitor(brand,model){
  if(!compData||!compData.brands)return null;
  for(var i=0;i<compData.brands.length;i++){
    if(compData.brands[i].brand!==brand)continue;
    var models=compData.brands[i].models||[];
    for(var j=0;j<models.length;j++)if(models[j].model===model)return models[j];
  }
  return null;
}

function normalizeCompetitor(brand,record){
  var capacity=record.capacity_l;
  return {
    brand:brand,
    model:record.model,
    kategori:CAT_LABELS[record.cat||record.subcat]||record.cat||record.subcat||null,
    door:record.door||null,
    kapasitas_gross:capacity||null,
    kapasitas_nett:null,
    kapasitas_catatan:capacity?"Kapasitas dari sumber adalah total; nilai nett/gross tidak dijelaskan.":null,
    range:null,
    material:null,
    daya_watt:null,
    garansi_tahun:null,
    varian:null,
    serie:null,
    harga_idr:record.price_idr||null,
    harga_source:record.price_source||null,
    fitur:(record.fitur||record.features||[]).slice(),
    benefit:null,
    foto:record.image||record.photo||null,
    photo_url:record.photo_url||null,
    source_url:record.source_url||null
  };
}

function fillMissingCanonical(canonical,fallback){
  var detail=Object.assign({},canonical);
  Object.keys(fallback||{}).forEach(function(key){
    var value=detail[key];
    if(value===null||value===undefined||value===""||(Array.isArray(value)&&value.length===0)){
      detail[key]=fallback[key];
    }
  });
  return detail;
}

function openDetail(brand,model){
  if(brand==="AQUA"){
    var canonical=findCanonical(model);
    if(!canonical){showToast("Record katalog Produk belum tersedia untuk "+model,"err");return;}
    var source=findCompetitor(brand,model);
    var detail=fillMissingCanonical(canonical,source?normalizeCompetitor(brand,source):{});
    window.MTMSProductDetail.open(detail,{
      canonicalUrl:"produk.html?model="+encodeURIComponent(model),
      sourceUrl:detail.source_url,
      sourceLabel:"Sumber "+brand+" "+model,
      photoUrl:detail.photo_url
    });
    return;
  }
  var source=findCompetitor(brand,model);
  if(!source){showToast("Detail belum tersedia untuk "+brand+" "+model,"err");return;}
  var detail=normalizeCompetitor(brand,source);
  window.MTMSProductDetail.open(detail,{
    sourceUrl:detail.source_url,
    sourceLabel:"Sumber "+brand+" "+model
  });
}

function renderRow(row,catCode){
  var aq=row.aqua;
  var html='<tr>';
  // AQUA cell
  if(aq){
    html+='<td class="comp-cell comp-aqua">'+detailTriggerHtml(aq)+
      '<div class="comp-row-actions">'+
      '<button class="comp-edit" data-brand="AQUA" data-model="'+esc(aq.model)+'">✎ Edit</button>'+
      '<button class="comp-del" data-brand="AQUA" data-model="'+esc(aq.model)+'">🗑 Hapus</button>'+
      '</div></td>';
  }else{
    html+='<td class="comp-cell comp-aqua comp-empty">&mdash;</td>';
  }
  // Competitor cells
  for(var bi=0;bi<BRANDS.length;bi++){
    var brand=BRANDS[bi];
    var c=row.competitors[brand];
    var lk=brand.toLowerCase();
    if(c){
      html+='<td class="comp-cell comp-'+lk+'">'+detailTriggerHtml(c)+
        '<div class="comp-row-actions">'+
        '<button class="comp-edit" data-brand="'+esc(c.brand)+'" data-model="'+esc(c.model)+'">✎ Edit</button>'+
        '<button class="comp-del" data-brand="'+esc(c.brand)+'" data-model="'+esc(c.model)+'">🗑 Hapus</button>'+
        '</div></td>';
    }else{
      html+='<td class="comp-cell comp-empty"><button type="button" class="comp-add-cell" data-brand="'+esc(brand)+'" data-aqua="'+esc(aq.model)+'" data-cat="'+esc(catCode)+'">＋ Model</button></td>';
    }
  }
  html+='</tr>';
  return html;
}

function renderAll(){
  var katalog=catalogData;
  var aqByCat={};
  for(var i=0;i<katalog.length;i++){
    var p=katalog[i];
    if(p.brand!=="AQUA")continue;
    var c=grpToCat(p.group);
    if(c){if(!aqByCat[c])aqByCat[c]=[];aqByCat[c].push(p);}
  }
  var html="";
  for(var ci=0;ci<CAT_ORDER.length;ci++){
    var catCode=CAT_ORDER[ci];
    var aqs=aqByCat[catCode]||[];
    if(!aqs.length)continue;
    var rows=buildRows(catCode);
    if(!rows.length)continue;
    html+='<section class="comp-category-section">'+
      '<div class="comp-cat-header"><div class="comp-category-heading">'+
      '<h2 class="comp-category-title">'+esc(CAT_LABELS[catCode])+'</h2>'+
      '<p class="comp-category-count">'+rows.length+' model</p></div>'+
      '<button class="comp-add-btn" data-cat="'+esc(catCode)+'">+ Tambah Model</button></div>'+
      '<div class="comp-table-wrap"><table class="comp-full-table"><thead><tr>'+
      '<th scope="col"><span class="comp-column-head-primary">AQUA</span><small class="comp-column-head-secondary">Referensi</small></th>'+
      '<th scope="col">LG</th><th scope="col">Midea</th><th scope="col">Polytron</th><th scope="col">Samsung</th><th scope="col">Sharp</th>'+
      '</tr></thead><tbody>';
    for(var ri=0;ri<rows.length;ri++)html+=renderRow(rows[ri],catCode);
    html+='</tbody></table></div></section>';
  }
  if(!html){emptyState.style.display="block";container.innerHTML="";}
  else{emptyState.style.display="none";container.innerHTML=html;}
  container.querySelectorAll(".comp-edit,.comp-del,.comp-add-btn,.comp-add-cell").forEach(function(button){
    button.disabled=!liveReady||saveBusy;
  });
  lazyLoad();
}

function lazyLoad(){
  var imgs=document.querySelectorAll(".comp-thumb[data-src]");
  for(var wi=0;wi<imgs.length;wi++)wireCardImageFallback(imgs[wi]);
  if("IntersectionObserver" in window){
    var obs=new IntersectionObserver(function(entries){
      for(var i=0;i<entries.length;i++){
        if(entries[i].isIntersecting){
          entries[i].target.src=entries[i].target.dataset.src;
          entries[i].target.removeAttribute("data-src");
          obs.unobserve(entries[i].target);
        }
      }
    },{rootMargin:"100px"});
    for(var i=0;i<imgs.length;i++)obs.observe(imgs[i]);
  }else{
    for(var i=0;i<imgs.length;i++){imgs[i].src=imgs[i].dataset.src;imgs[i].removeAttribute("data-src");}
  }
}

/* === EVENT DELEGATION for edit/delete/add buttons === */
container.addEventListener("click",function(e){
  var btn=e.target.closest(".comp-edit");
  if(btn){doEdit(btn.dataset.brand,btn.dataset.model);return;}
  btn=e.target.closest(".comp-del");
  if(btn){doDel(btn.dataset.brand,btn.dataset.model);return;}
  btn=e.target.closest(".comp-add-btn");
  if(btn){doAdd(btn.dataset.cat);return;}
  btn=e.target.closest(".comp-add-cell");
  if(btn){doAddInCell(btn.dataset.brand,btn.dataset.aqua);return;}
  btn=e.target.closest(".comp-detail-trigger");
  if(btn){openDetail(btn.dataset.brand,btn.dataset.model);return;}
});

/* === EDIT OVERLAY === */
function openOverlay(title,fields,onSave){
  var o=document.createElement("div");
  o.className="comp-edit-overlay";
  var h='<div class="comp-edit-card"><h3>'+esc(title)+'</h3>';
  for(var i=0;i<fields.length;i++){
    var f=fields[i];
    // add section divider for fields after the 3rd (index 2) and 5th (index 4)
    if(i===3 || i===5) h+='<div class="comp-edit-seksi"></div>';
    h+='<label>'+esc(f.label)+'</label>';
    if(f.type==="textarea"){
      h+='<textarea id="cef_'+f.id+'" placeholder="'+esc(f.ph||"")+'">'+esc(f.val||"")+'</textarea>';
    }else if(f.type==="select"){
      h+='<select id="cef_'+f.id+'">';
      for(var j=0;j<f.opts.length;j++){
        h+='<option value="'+esc(f.opts[j].v)+'"'+(f.opts[j].v===f.val?" selected":"")+'> '+esc(f.opts[j].t)+'</option>';
      }
      h+='</select>';
    }else{
      h+='<input type="'+(f.type||"text")+'" id="cef_'+f.id+'" value="'+esc(f.val||"")+'" placeholder="'+esc(f.ph||"")+'">';
    }
    if(f.preview){
      var previewUrl=displayableImage(f.val);
      h+='<img class="foto-preview" id="cef_prev_'+f.id+'"'+(previewUrl?' src="'+esc(previewUrl)+'"':'')+'>';
    }
    if(f.fileUpload){
      h+='<div class="foto-upload-row"><input type="file" id="cef_file_'+f.id+'" accept="image/*"><button type="button" id="cef_up_'+f.id+'">Preview lokal</button></div>';
    }
  }
  h+='<div class="edit-actions"><button class="btn-cancel" id="cef_cancel">Batal</button><button class="btn-save" id="cef_save">Simpan</button></div></div>';
  o.innerHTML=h;
  document.body.appendChild(o);

  for(var pi=0;pi<fields.length;pi++){
    if(!fields[pi].preview)continue;
    var preview=o.querySelector("#cef_prev_"+fields[pi].id);
    if(preview)preview.addEventListener("error",function(){this.style.display="none";},{once:true});
  }

  // Wire upload buttons
  for(var i=0;i<fields.length;i++){
    if(fields[i].fileUpload)(function(fid){
      var upBtn=o.querySelector("#cef_up_"+fid);
      if(upBtn)upBtn.onclick=function(){
        var fi=o.querySelector("#cef_file_"+fid);
        if(!fi||!fi.files.length)return;
        var reader=new FileReader();
        reader.onload=function(ev){
          var uploadUrl=localPreviewImage(ev.target.result);
          if(!uploadUrl){showToast("Format preview tidak aman. Gunakan PNG, JPG, GIF, atau WebP.","err");return;}
          var prev=o.querySelector("#cef_prev_"+fid);
          if(prev){prev.src=uploadUrl;prev.style.display="";}
          showToast("Preview lokal siap. Isi URL Gambar tidak diubah.","info");
        };
        reader.readAsDataURL(fi.files[0]);
      };
    })(fields[i].id);
  }

  o.querySelector("#cef_cancel").onclick=function(){o.remove();};
  o.querySelector("#cef_save").onclick=function(){
    var vals={};
    for(var i=0;i<fields.length;i++){
      vals[fields[i].id]=o.querySelector("#cef_"+fields[i].id).value;
    }
    onSave(vals);
    o.remove();
  };
  o.addEventListener("click",function(e){if(e.target===o)o.remove();});
}

function doEdit(brand,model){
  if(!compData)return;
  var bd=null;
  for(var i=0;i<compData.brands.length;i++){
    if(compData.brands[i].brand===brand){bd=compData.brands[i];break;}
  }
  if(!bd)return;
  var m=null;
  for(var i=0;i<bd.models.length;i++){
    if(bd.models[i].model===model){m=bd.models[i];break;}
  }
  if(!m)return;
  var catOpts=[];
  for(var i=0;i<CAT_ORDER.length;i++)catOpts.push({v:CAT_ORDER[i],t:CAT_LABELS[CAT_ORDER[i]]});
  openOverlay("Edit: "+brand+" "+model,[
    {id:"model",label:"Model",val:m.model},
    {id:"cat",label:"Kategori",type:"select",val:m.cat||m.subcat||"TM",opts:catOpts},
    {id:"cap",label:"Kapasitas (L)",type:"number",val:m.capacity_l||""},
    {id:"price",label:"Harga (Rp)",type:"number",val:m.price_idr||""},
    {id:"fitur",label:"Fitur (1 baris = 1 poin)",type:"textarea",val:(m.fitur||[]).join("\n"),ph:"Inverter\nAnti-bakteri"},
    {id:"image",label:"URL Gambar",val:m.image||"",ph:"https://... atau upload",fileUpload:true,preview:true},
    {id:"source",label:"Sumber URL",val:m.source_url||"",ph:"https://..."}
  ],function(v){
    var imageUrl=String(v.image||"").trim();
    if(imageUrl&&!displayableImage(imageUrl)){showToast("URL gambar wajib http/https atau path relatif situs.","err");return;}
    var prevSnap=JSON.parse(JSON.stringify(compData));
    var oldModel=m.model;
    m.model=v.model;
    if(m.model_id)m.model_id=brand+"::"+m.model;
    m.cat=v.cat;m.subcat=v.cat;
    m.capacity_l=Number(v.cap)||0;
    m.price_idr=Number(v.price)||0;
    m.fitur=v.fitur.split("\n").map(function(s){return s.trim()}).filter(Boolean);
    if(imageUrl)m.image=imageUrl;
    m.source_url=v.source;
    // keep group references in sync on rename
    if(oldModel!==m.model&&compData.groups){
      for(var gi=0;gi<compData.groups.length;gi++){
        var g=compData.groups[gi];
        if(brand==="AQUA"&&g.aqua===oldModel)g.aqua=m.model;
        if(brand!=="AQUA"&&g.competitors&&g.competitors[brand]===oldModel)g.competitors[brand]=m.model;
      }
    }
    saveData(prevSnap);
  });
}

function doDel(brand,model){
  if(!compData)return;
  if(!confirm("Hapus "+brand+" "+model+"?"))return;
  var prevSnap=JSON.parse(JSON.stringify(compData));
  var bd=null;
  for(var i=0;i<compData.brands.length;i++){
    if(compData.brands[i].brand===brand){bd=compData.brands[i];break;}
  }
  if(!bd)return;
  bd.models=bd.models.filter(function(m){return m.model!==model});
  // remove from groups
  if(compData.groups){
    for(var gi=compData.groups.length-1;gi>=0;gi--){
      var g=compData.groups[gi];
      if(brand==="AQUA"){
        if(g.aqua===model)compData.groups.splice(gi,1);
      }else{
        if(g.competitors&&g.competitors[brand]===model)delete g.competitors[brand];
      }
    }
  }
  saveData(prevSnap);
}

function doAdd(catCode){
  var catOpts=[];
  for(var i=0;i<CAT_ORDER.length;i++)catOpts.push({v:CAT_ORDER[i],t:CAT_LABELS[CAT_ORDER[i]]});
  var brandOpts=[];
  for(var i=0;i<BRANDS.length;i++)brandOpts.push({v:BRANDS[i],t:BRANDS[i]});
  openOverlay("Tambah Model Baru",[
    {id:"brand",label:"Brand",type:"select",val:"LG",opts:brandOpts},
    {id:"model",label:"Model",val:"",ph:"GN-Y201CLAR"},
    {id:"cat",label:"Kategori",type:"select",val:catCode,opts:catOpts},
    {id:"cap",label:"Kapasitas (L)",type:"number",val:""},
    {id:"price",label:"Harga (Rp)",type:"number",val:""},
    {id:"fitur",label:"Fitur (1 baris = 1 poin)",type:"textarea",val:"",ph:"Inverter\nAnti-bakteri"},
    {id:"image",label:"URL Gambar",val:"",ph:"https://... atau upload",fileUpload:true,preview:true},
    {id:"source",label:"Sumber URL",val:"",ph:"https://..."}
  ],function(v){
    var imageUrl=String(v.image||"").trim();
    if(imageUrl&&!displayableImage(imageUrl)){showToast("URL gambar wajib http/https atau path relatif situs.","err");return;}
    var prevSnap=JSON.parse(JSON.stringify(compData));
    var bd=null;
    for(var i=0;i<compData.brands.length;i++){
      if(compData.brands[i].brand===v.brand){bd=compData.brands[i];break;}
    }
    if(!bd)return;
    bd.models.push({
      model:v.model,cat:v.cat,subcat:v.cat,
      capacity_l:Number(v.cap)||0,price_idr:Number(v.price)||0,
      fitur:v.fitur.split("\n").map(function(s){return s.trim()}).filter(Boolean),
      image:imageUrl,source_url:v.source
    });
    if(!compData.groups)compData.groups=[];
    if(v.brand==="AQUA"){
      // new AQUA model = new group (no competitors yet)
      compData.groups.push({aqua:v.model,competitors:{}});
    }else{
      // attach competitor to closest AQUA group in same category
      var best=null;
      for(var gi=0;gi<compData.groups.length;gi++){
        var g=compData.groups[gi];
        if(g.competitors&&g.competitors[v.brand])continue;
        var aq=null;
        for(var i=0;i<compData.brands[0].models.length;i++){
          if(compData.brands[0].models[i].model===g.aqua){aq=compData.brands[0].models[i];break;}
        }
        if(!aq)continue;
        var aqc=aq.cat||aq.subcat||"";
        if(aqc!==v.cat)continue;
        if(!best||Math.abs((aq.capacity_l||0)-Number(v.cap))<Math.abs((best.cap||0)-Number(v.cap))){
          best={g:g,cap:aq.capacity_l||0};
        }
      }
      if(best){
        if(!best.g.competitors)best.g.competitors={};
        best.g.competitors[v.brand]=v.model;
      }
    }
    saveData(prevSnap);
  });
}

function saveData(prevSnap){
  if(!compSha){
    if(prevSnap)compData=prevSnap;
    renderAll();
    showToast("Editor belum punya SHA data live. Muat ulang halaman.","err");
    return;
  }
  var sequence=beginSaveSequence();
  if(!sequence){
    if(prevSnap)compData=prevSnap;
    renderAll();
    showToast("Penyimpanan sebelumnya masih berjalan. Perubahan kedua dibatalkan.","err");
    return;
  }
  // optimistic: langsung render state baru di memori, PUT jalan di background
  renderAll();
  showToast("Menyimpan\u2026","info");
  fetch("api/kompetitor",{method:"PUT",headers:{"Content-Type":"application/json","If-Match":"\""+compSha+"\""},body:JSON.stringify(compData)})
  .then(function(r){return r.json().catch(function(){return{}}).then(function(d){return{ok:r.ok,status:r.status,d:d,sha:r.headers.get("X-Data-SHA")||d.sha}})})
  .then(function(result){
    if(!isCurrentSave(sequence))return;
    if(result.ok){
      compSha=result.sha||compSha;
      finishSaveSequence(sequence);
      renderAll();
      showToast("Tersimpan","ok");
      return;
    }
    if(prevSnap)compData=prevSnap;
    if(result.status===412){
      // Jangan retry atau mempertahankan state stale walau sesaat.
      compSha="";
      liveReady=false;
      window.MTMS_COMPETITOR_LIVE_READY=false;
      invalidateSaveSequence();
      renderAll();
      showToast("Data berubah di tempat lain. Memuat ulang data terbaru...","err");
      setTimeout(function(){window.location.reload();},0);
      return;
    }
    finishSaveSequence(sequence);
    renderAll();
    showToast("Gagal: "+(result.d.error||"coba lagi"),"err");
  })
  .catch(function(e){
    if(!isCurrentSave(sequence))return;
    if(prevSnap)compData=prevSnap;
    finishSaveSequence(sequence);
    renderAll();
    showToast("Error: "+e.message,"err");
  });
}

var toastTimer=null;
function showToast(msg,type){
  var el=document.getElementById("comp-toast");
  if(!el){el=document.createElement("div");el.id="comp-toast";el.className="comp-toast";document.body.appendChild(el);}
  el.textContent=msg;
  el.className="comp-toast "+(type==="ok"?"ok":(type==="err"?"err":""));
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.remove();},type==="err"?5000:2200);
}

/* === INIT === */
function isHttp(){return window.location.protocol==="http:"||window.location.protocol==="https:";}
function cloneData(value){return JSON.parse(JSON.stringify(value));}
function embeddedCatalog(){return(window.MTMS_DATA&&window.MTMS_DATA.katalog)||[];}
function embeddedCompetitor(){return(window.MTMS_DATA&&window.MTMS_DATA.kompetitor)||{brands:[]};}

function loadCatalog(){
  if(!isHttp()){catalogData=embeddedCatalog();return Promise.resolve();}
  return fetch("api/produk").then(function(r){
    if(!r.ok)throw new Error("api "+r.status);
    return r.json();
  }).then(function(data){catalogData=data;}).catch(function(){});
}

function enrichCompetitor(data){
  var embedded=embeddedCompetitor();
  var evidence={};
  var embeddedBrands=embedded.brands||[];
  for(var i=0;i<embeddedBrands.length;i++){
    var brand=embeddedBrands[i].brand;
    var models=embeddedBrands[i].models||[];
    for(var j=0;j<models.length;j++)evidence[brand+"|"+models[j].model]=models[j];
  }
  var brands=data.brands||[];
  for(var bi=0;bi<brands.length;bi++){
    var apiBrand=brands[bi].brand;
    var apiModels=brands[bi].models||[];
    for(var mi=0;mi<apiModels.length;mi++){
      var apiModel=apiModels[mi];
      var proof=evidence[apiBrand+"|"+apiModel.model];
      if(!proof)continue;
      var fullFeatures=proof.fitur||proof.features||[];
      if(fullFeatures.length)apiModel.fitur=fullFeatures.slice();
      ["door","source_url","price_source","image","photo","photo_url"].forEach(function(field){
        if(proof[field]!==null&&proof[field]!==undefined&&proof[field]!=="")apiModel[field]=proof[field];
      });
    }
  }
  return data;
}

function loadData(){
  if(!isHttp()){
    compData=enrichCompetitor(cloneData(embeddedCompetitor()));
    return Promise.resolve();
  }
  // coba data live dari API (editable, sumber GitHub). Kalau gagal, pakai data bawaan.
  return fetch("api/kompetitor").then(function(r){
    if(!r.ok)throw new Error("api "+r.status);
    compSha=String(r.headers.get("X-Data-SHA")||r.headers.get("ETag")||"").replace(/^W\//,"").replace(/^\"|\"$/g,"");
    return r.json();
  // liveReady mempertahankan arti lama: GET API selesai. saveData tetap fail-closed
  // ketika compSha kosong, sedangkan panel tiket 02 punya gate SHA sendiri.
  }).then(function(d){
    compData=enrichCompetitor(d);liveReady=true;
    window.MTMSDynamicSpecEditor.mount({
      dataUrl: "api/kompetitor",
      categoriesUrl: "api/spec-categories",
      initialData: d,
      initialSha: compSha
    });
    return d;
  }).catch(function(){});
}
catalogData=cloneData(embeddedCatalog());
compData=enrichCompetitor(cloneData(embeddedCompetitor()));
renderAll();
if(isHttp()){
  Promise.all([loadCatalog(),loadData()]).then(function(){
    window.MTMS_COMPETITOR_LIVE_READY=liveReady;
    renderAll();
  });
}
})();
